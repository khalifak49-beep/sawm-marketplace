# نشر منصة ساوم على Render — رابط دائم يشغّل ASP.NET فعلاً
services:
  - type: web
    name: sawm-marketplace
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_PROVIDER
        value: sqlite
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # رابط الموقع العام — لبناء روابط التفعيل والإشعارات في الرسائل
      - key: Email__BaseUrl
        value: https://sawm-marketplace.onrender.com
      # Render يحجب منافذ SMTP الصادرة — نرسل عبر Brevo (HTTPS/443)
      - key: Email__Provider
        value: brevo
      # مفتاح Brevo — سرّي: يُضبط في لوحة Render (Environment) ولا يُحفظ في المستودع
      - key: Email__ApiKey
        sync: false
      # كلمة مرور SMTP — للاستخدام المحلي فقط (اختياري على Render)
      - key: Email__Password
        sync: false
